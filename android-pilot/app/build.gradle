plugins {
    id 'com.android.application'
}

def bazaarPublicKey = providers.gradleProperty('BAZAAR_IAB_PUBLIC_KEY').orElse('').get()
def myketPublicKey = providers.gradleProperty('MYKET_IAB_PUBLIC_KEY').orElse('').get()
def apiBaseUrl = providers.gradleProperty('SAHMINO_API_BASE_URL').orElse('').get()
def pwaOrigin = providers.gradleProperty('SAHMINO_PWA_ORIGIN').orElse('https://raminhashemi1.github.io').get()
def apiBaseUrlLiteral = groovy.json.JsonOutput.toJson(apiBaseUrl)
def pwaOriginLiteral = groovy.json.JsonOutput.toJson(pwaOrigin)
def skuValue = { channel, suffix ->
    def fallback = "sahmino_pro_" + suffix.toLowerCase()
    providers.gradleProperty(channel + "_SKU_" + suffix).orElse(fallback).get()
}
def bazaarSku30 = groovy.json.JsonOutput.toJson(skuValue('BAZAAR', '30D'))
def bazaarSku60 = groovy.json.JsonOutput.toJson(skuValue('BAZAAR', '60D'))
def bazaarSku90 = groovy.json.JsonOutput.toJson(skuValue('BAZAAR', '90D'))
def bazaarSku180 = groovy.json.JsonOutput.toJson(skuValue('BAZAAR', '180D'))
def bazaarSku365 = groovy.json.JsonOutput.toJson(skuValue('BAZAAR', '365D'))
def myketSku30 = groovy.json.JsonOutput.toJson(skuValue('MYKET', '30D'))
def myketSku60 = groovy.json.JsonOutput.toJson(skuValue('MYKET', '60D'))
def myketSku90 = groovy.json.JsonOutput.toJson(skuValue('MYKET', '90D'))
def myketSku180 = groovy.json.JsonOutput.toJson(skuValue('MYKET', '180D'))
def myketSku365 = groovy.json.JsonOutput.toJson(skuValue('MYKET', '365D'))

android {
    // Source namespace stays stable; applicationId below is the publisher-approved store identity.
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Permanent package ID approved by the app owner; both stores must register this exact ID.
        applicationId 'ir.manahesab.sahmino'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0-market-flavors-preview'
    }

    // Store flavors are isolated per distribution channel. Product IDs are replaceable mappings;
    // store-generated IDs are reconciled during publisher-console upload/configuration.
    buildFeatures { buildConfig true }

    // Keep store SDK implementations out of the shared source set.
    sourceSets {
        main.java.exclude 'ir/sahamban/pilot/SubscriptionPreviewActivity.java'
        main.java.exclude 'ir/sahamban/pilot/SahminoStoreBillingManager.java'
        main.java.exclude 'ir/sahamban/pilot/SahminoPurchaseEvidence.java'
    }

    flavorDimensions 'store'
    productFlavors {
        bazaar {
            dimension 'store'
            manifestPlaceholders = [
                marketApplicationId: 'com.farsitel.bazaar',
                marketBindAddress: 'ir.cafebazaar.pardakht.InAppBillingService.BIND',
                marketPermission: 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR'
            ]
            buildConfigField 'String', 'STORE_CHANNEL', '"CAFEBAZAAR"'
            buildConfigField 'String', 'API_BASE_URL', apiBaseUrlLiteral
            buildConfigField 'String', 'PWA_ORIGIN', pwaOriginLiteral
            buildConfigField 'String', 'IAB_PUBLIC_KEY', '"' + bazaarPublicKey + '"'
            buildConfigField 'String', 'SKU_30D', bazaarSku30
            buildConfigField 'String', 'SKU_60D', bazaarSku60
            buildConfigField 'String', 'SKU_90D', bazaarSku90
            buildConfigField 'String', 'SKU_180D', bazaarSku180
            buildConfigField 'String', 'SKU_365D', bazaarSku365
        }
        myket {
            dimension 'store'
            manifestPlaceholders = [
                marketApplicationId: 'ir.mservices.market',
                marketBindAddress: 'ir.mservices.market.InAppBillingService.BIND',
                marketPermission: 'ir.mservices.market.BILLING'
            ]
            buildConfigField 'String', 'STORE_CHANNEL', '"MYKET"'
            buildConfigField 'String', 'API_BASE_URL', apiBaseUrlLiteral
            buildConfigField 'String', 'PWA_ORIGIN', pwaOriginLiteral
            buildConfigField 'String', 'IAB_PUBLIC_KEY', '"' + myketPublicKey + '"'
            buildConfigField 'String', 'SKU_30D', myketSku30
            buildConfigField 'String', 'SKU_60D', myketSku60
            buildConfigField 'String', 'SKU_90D', myketSku90
            buildConfigField 'String', 'SKU_180D', myketSku180
            buildConfigField 'String', 'SKU_365D', myketSku365
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { }
        release {
            // No release signing is configured until the owner supplies and
            // securely stores the permanent upload key. Never publish unsigned.
            minifyEnabled false
        }
    }
}

dependencies {
    // Each store SDK is isolated to its own install flavor.
    implementation 'androidx.activity:activity:1.10.1'
    myketImplementation 'ir.myket:billing:2.2'
    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
}
