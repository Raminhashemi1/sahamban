        buildConfigField 'String', 'SAHAMBAN_SKU_PRO_90D', '"' + (System.getenv('SAHAMBAN_SKU_PRO_90D') ?: '') + '"'
        buildConfigField 'String', 'SAHAMBAN_SKU_PRO_180D', '"' + (System.getenv('SAHAMBAN_SKU_PRO_180D') ?: '') + '"'
        buildConfigField 'String', 'SAHAMBAN_SKU_PRO_365D', '"' + (System.getenv('SAHAMBAN_SKU_PRO_365D') ?: '') + '"'
    }

    flavorDimensions += 'store'
    productFlavors {
        bazaar {
            dimension 'store'
            if (distinctPilotIds) applicationIdSuffix = '.bazaar.pilot'
            manifestPlaceholders['marketApplicationId'] = 'com.farsitel.bazaar'
            manifestPlaceholders['marketBindAddress'] = 'ir.cafebazaar.pardakht.InAppBillingService.BIND'
            manifestPlaceholders['marketPermission'] = 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR'
            buildConfigField 'String', 'BILLING_STORE', '"BAZAAR"'
            buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', '"' + (System.getenv('BAZAAR_RSA_PUBLIC_KEY') ?: '') + '"'
            buildConfigField 'boolean', 'SAHAMBAN_BILLING_ENABLED', (commonBillingReady && (System.getenv('BAZAAR_RSA_PUBLIC_KEY') ?: '').length() > 100).toString()
        }
        myket {
