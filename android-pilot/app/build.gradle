plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Temporary test-only identifier. Owner must approve final package ID.
        applicationId 'ir.sahamban.pilot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.2-installer-routing-preview'
    }

    // One identical APK for all stores. Installer provenance is assessed at
    // runtime as a best-effort UI hint, NEVER as payment authorization.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
}
