            if (distinctPilotIds) applicationIdSuffix = '.myket.pilot'
            manifestPlaceholders['marketApplicationId'] = 'ir.mservices.market'
            manifestPlaceholders['marketBindAddress'] = 'ir.mservices.market.InAppBillingService.BIND'
            manifestPlaceholders['marketPermission'] = 'ir.mservices.market.BILLING'
            buildConfigField 'String', 'BILLING_STORE', '"MYKET"'
            buildConfigField 'String', 'MYKET_PUBLIC_KEY', '"' + (System.getenv('MYKET_PUBLIC_KEY') ?: '') + '"'
            buildConfigField 'boolean', 'SAHAMBAN_BILLING_ENABLED', (commonBillingReady && (System.getenv('MYKET_PUBLIC_KEY') ?: '').length() > 100).toString()
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
            buildConfigField 'boolean', 'SAHAMBAN_BILLING_ENABLED', 'false'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
    myketImplementation 'ir.myket:billing:2.2'
}
