plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Temporary test-only identifier. Owner must approve final package ID.
        applicationId 'ir.sahamban.pilot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.1-subscription-in-app'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
}
