plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Temporary test-only identifier. Owner must approve final package ID.
        applicationId 'ir.sahamban.pilot'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.5-pilot'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // CI debug keystores are ephemeral: avoid signature-clashing upgrades
            // and never require uninstalling an existing pilot or public PWA.
            applicationIdSuffix '.restore'
        }
        acceptance {
            // Owner-approved debug-only, isolated real-PWA acceptance package.
            // This is NOT a release build and never upgrades the existing pilot.
            initWith debug
            applicationIdSuffix '.acceptancefix'
            matchingFallbacks = ['debug']
        }
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
    sourceSets {
        acceptance {
            // Generated from first-party root assets on this exact checkout.
            assets.srcDir layout.buildDirectory.dir('generated/acceptanceAssets')
        }
    }
}

// Do not include repository documents, financial evidence, or private fixture files.
// The on-device acceptance variant gets ONLY the allowlisted top-level public
// PWA assets, with a deterministic per-file SHA-256 manifest of actual bytes.
tasks.register('prepareAcceptanceAssets') {
    def repoRoot = rootProject.projectDir.parentFile
    def outputDir = layout.buildDirectory.dir('generated/acceptanceAssets')
    inputs.files(fileTree(repoRoot) {
        include '*.html', '*.js', '*.css', '*.svg', '*.png', '*.webmanifest', '*.mp3', '*.ico'
        exclude 'sw.js'
    })
    outputs.dir(outputDir)
    doLast {
        def target = outputDir.get().asFile
        project.delete(target)
        def pwa = new File(target, 'pwa')
        pwa.mkdirs()
        def assets = fileTree(repoRoot) {
            include '*.html', '*.js', '*.css', '*.svg', '*.png', '*.webmanifest', '*.mp3', '*.ico'
            exclude 'sw.js'
        }.files.sort { it.name }
        if (!assets.any { it.name == 'index.html' } ||
            !assets.any { it.name == 'native-backup-export-v1.js' } ||
            !assets.any { it.name == 'local-backup-v148.js' }) {
            throw new GradleException('Matching isolated PWA assets missing')
        }
        def hashes = [:]
        assets.each { source ->
            byte[] bytes = source.bytes
            new File(pwa, source.name).bytes = bytes
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
            def extension = source.name.substring(source.name.lastIndexOf('.') + 1)
            def mime = [
                html: 'text/html', js: 'application/javascript', css: 'text/css',
                svg: 'image/svg+xml', png: 'image/png', webmanifest: 'application/manifest+json',
                mp3: 'audio/mpeg', ico: 'image/x-icon'
            ][extension]
            if (mime == null) throw new GradleException('Unexpected asset extension')
            hashes[source.name] = [
                sha256: digest.collect { String.format('%02x', it & 0xff) }.join(''),
                bytes: bytes.length, mime: mime
            ]
        }
        def headProcess = new ProcessBuilder('git', '-C', repoRoot.absolutePath,
                'rev-parse', 'HEAD').redirectErrorStream(true).start()
        def sourceCommit = headProcess.inputStream.getText('UTF-8').trim()
        if (headProcess.waitFor() != 0 || !(sourceCommit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('Cannot pin acceptance assets to a Git commit')
        }
        new File(target, 'acceptance-asset-manifest.json').text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                profile: 'synthetic-only-debug-acceptance',
                sourceCommit: sourceCommit,
                path: '/sahamban/',
                files: hashes
            ]))
    }
}

tasks.configureEach {
    // Only package the snapshot on the acceptance variant; do not modify debug/release.
    if (name == 'mergeAcceptanceAssets') dependsOn 'prepareAcceptanceAssets'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
