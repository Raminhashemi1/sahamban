plugins {
    id 'com.android.application'
}

android {
    // Keep the source/resource namespace stable; applicationId is the store identity.
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Owner-approved permanent Android package ID for Sahmino.
        applicationId 'ir.sahmino.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-pilot'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
}

dependencies {
    // Origin-scoped WebMessageListener; no general-purpose addJavascriptInterface bridge.
    implementation 'androidx.webkit:webkit:1.18.0'
}
