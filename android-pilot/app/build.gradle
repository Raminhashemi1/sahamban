plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        // Temporary test-only identifier. Owner must approve final package ID.
        applicationId 'ir.sahamban.pilot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.1-subscription-in-app'
    }

    // Distribution determines payment provider, never the customer.
    // These are test builds; merchant SDK and real checkout are still disabled.
    buildFeatures {
        buildConfig true
    }
    flavorDimensions 'distribution'
    productFlavors {
        bazaar {
            dimension 'distribution'
            buildConfigField 'String', 'BILLING_CHANNEL', '"CAFEBAZAAR"'
        }
        myket {
            dimension 'distribution'
            buildConfigField 'String', 'BILLING_CHANNEL', '"MYKET"'
        }
        play {
            dimension 'distribution'
            buildConfigField 'String', 'BILLING_CHANNEL', '"GOOGLE_PLAY"'
        }
        web {
            dimension 'distribution'
            buildConfigField 'String', 'BILLING_CHANNEL', '"WEB_DIRECT"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
}
