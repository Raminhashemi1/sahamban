        buildConfigField 'String', 'SAHAMBAN_WORKER_BASE_URL', '"' + workerUrl + '"'
        buildConfigField 'String', 'SAHAMBAN_PWA_ORIGIN', '"' + pwaOrigin + '"'
        buildConfigField 'String', 'SAHAMBAN_EXPECTED_PACKAGE_NAME', '"' + expectedPackage + '"'
        buildConfigField 'String', 'SAHAMBAN_SKU_PRO_30D', '"' + (System.getenv('SAHAMBAN_SKU_PRO_30D') ?: '') + '"'
