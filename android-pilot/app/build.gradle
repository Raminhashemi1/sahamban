plugins {
    id 'com.android.application'
}

def bazaarPublicKey = providers.gradleProperty('BAZAAR_PUBLIC_KEY')
    .orElse(providers.environmentVariable('BAZAAR_PUBLIC_KEY')).getOrElse('')
def myketPublicKey = providers.gradleProperty('MYKET_PUBLIC_KEY')
    .orElse(providers.environmentVariable('MYKET_PUBLIC_KEY')).getOrElse('')

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        // Temporary test-only identifier. Owner must approve final package ID.
        applicationId 'ir.sahamban.pilot'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.3-sahmino-branding-preview'
    }

    // Separate store builds keep provider SDKs and signing/configuration isolated.
    flavorDimensions 'store'
    productFlavors {
        bazaar {
            dimension 'store'
            manifestPlaceholders = [
                marketApplicationId: 'com.farsitel.bazaar',
                marketBindAddress: 'ir.cafebazaar.pardakht.InAppBillingService.BIND',
                marketPermission: 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR'
            ]
            buildConfigField 'String', 'BAZAAR_PUBLIC_KEY', '"' + bazaarPublicKey + '"'
        }
        myket {
            dimension 'store'
            manifestPlaceholders = [
                marketApplicationId: 'ir.mservices.market',
                marketBindAddress: 'ir.mservices.market.InAppBillingService.BIND',
                marketPermission: 'ir.mservices.market.BILLING'
            ]
            buildConfigField 'String', 'MYKET_PUBLIC_KEY', '"' + myketPublicKey + '"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Never publish an unsigned/automatically debug-signed release.
            minifyEnabled false
        }
    }
}

dependencies {
    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
    myketImplementation 'ir.myket:billing:2.2'
}
