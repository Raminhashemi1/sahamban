plugins {
    id 'com.android.application'
}

def bazaarPublicKey = providers.gradleProperty('BAZAAR_IAB_PUBLIC_KEY').orElse('').get()

android {
    namespace 'ir.sahamban.pilot'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.manahesab.sahmino'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0-bazaar-only-preview'
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main.java.exclude 'ir/sahamban/pilot/SubscriptionPreviewActivity.java'
        main.java.exclude 'ir/sahamban/pilot/SahminoStoreBillingManager.java'
        main.java.exclude 'ir/sahamban/pilot/SahminoPurchaseEvidence.java'
    }

    flavorDimensions 'store'
    productFlavors {
        bazaar {
            dimension 'store'
            manifestPlaceholders = [
                marketApplicationId: 'com.farsitel.bazaar',
                marketBindAddress: 'ir.cafebazaar.pardakht.InAppBillingService.BIND',
                marketPermission: 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR'
            ]
            buildConfigField 'String', 'STORE_CHANNEL', '"CAFEBAZAAR"'
            buildConfigField 'String', 'IAB_PUBLIC_KEY', '"' + bazaarPublicKey + '"'
            buildConfigField 'String', 'SKU_30D', '"sahmino_pro_30d"'
            buildConfigField 'String', 'SKU_60D', '"sahmino_pro_60d"'
            buildConfigField 'String', 'SKU_90D', '"sahmino_pro_90d"'
            buildConfigField 'String', 'SKU_180D', '"sahmino_pro_180d"'
            buildConfigField 'String', 'SKU_365D', '"sahmino_pro_365d"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'\n    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey-rx:2.2.0'
}
