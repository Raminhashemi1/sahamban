name: Sahamban WebKit mobile acceptance proxy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  webkit-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps webkit
      - run: node tests/webkit-mobile-v106.cjs
      - run: node tests/webkit-a11y-proxy-v109.cjs
      - run: SAHAMBAN_UI_ENGINE=webkit node tests/holdings-ui-matrix-v117.cjs
      - run: SAHAMBAN_A11Y_ENGINE=webkit node tests/portfolio-axe-v118.cjs
      - run: SAHAMBAN_INSTALL_ENGINE=webkit node tests/pwa-install-v119.cjs
      - name: Preserve PWA install readiness proof (WebKit)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-pwa-install-v119-webkit
          path: test-artifacts/pwa-install-v119-webkit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve WCAG audit WebKit findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-a11y-webkit-v118
          path: test-artifacts/a11y-v118-webkit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save synthetic WebKit holdings UI matrix result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-webkit-holdings-ui-v117
          path: test-artifacts/holdings-ui-matrix-v117-webkit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-webkit-mobile-failure
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
