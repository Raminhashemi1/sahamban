name: Sahamban WebKit mobile acceptance proxy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  webkit-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/webkit-mobile-v106.cjs
      - run: node tests/webkit-a11y-proxy-v109.cjs
      - name: Save WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-webkit-mobile-failure
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
