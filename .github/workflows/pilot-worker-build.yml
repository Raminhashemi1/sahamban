name: Sahamban free pilot Worker build verification
on:
  push:
    branches: [main, feature/sahmino-username-password-auth]
    paths:
      - 'server/**'
      - 'tests/pilot-orders-api.test.cjs'
      - 'tests/worker-api.test.cjs'
      - 'tests/password-auth*'
      - 'tests/worker-local-runtime.cjs'
      - 'tests/mint-pilot-token.test.cjs'
      - 'tests/billing-v2*.test.*'
      - '.github/workflows/pilot-worker-build.yml'
  pull_request:
    branches: [main, integration/sahmino-app-billing-complete]
    paths:
      - 'server/**'
      - 'tests/worker-api.test.cjs'
      - 'tests/pilot-orders-api.test.cjs'
      - 'tests/mint-pilot-token.test.cjs'
      - 'tests/password-auth*'
      - 'tests/worker-local-runtime.cjs'
      - 'tests/billing-v2*.test.*'
      - '.github/workflows/pilot-worker-build.yml'
  workflow_dispatch:
jobs:
  offline-worker-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test private pilot security rules
        run: node --test tests/worker-api.test.cjs tests/pilot-orders-api.test.cjs tests/mint-pilot-token.test.cjs tests/billing-v2.test.cjs tests/billing-v2-catalog.test.cjs tests/billing-v2-bazaar.test.mjs tests/billing-v2-settlement.test.cjs tests/billing-v2-d1.integration.test.cjs tests/billing-v2-feature-gate.test.cjs tests/billing-v2-myket-verifier.test.mjs tests/billing-v2-myket-orders.test.cjs tests/billing-v2-myket-settlement.test.cjs tests/billing-v2-myket-flow.test.mjs tests/password-auth.test.cjs
      - name: Install pinned Wrangler CLI for offline build
        run: npm install --no-save wrangler@4.102.0
      - name: Bundle Cloudflare Worker without deploying or contacting merchant
        run: npx wrangler deploy --dry-run --config server/wrangler.local.toml --outdir /tmp/sahamban-worker-bundle
      - name: Apply application schema to isolated local Cloudflare D1
        run: npx wrangler d1 execute SAHAMBAN_DB --local --config server/wrangler.local.toml --file server/d1-schema.sql --yes
      - name: Apply isolated Billing V2 manual-purchase schema
        run: npx wrangler d1 execute SAHAMBAN_DB --local --config server/wrangler.local.toml --file server/billing/schema.sql --yes
      - name: Apply username/password migration to isolated local D1
        run: npx wrangler d1 execute SAHAMBAN_DB --local --config server/wrangler.local.toml --file server/migrations/0004-username-password-auth.sql --yes
      - name: Verify isolated Billing V2 tables exist
        run: npx wrangler d1 execute SAHAMBAN_DB --local --config server/wrangler.local.toml --command "SELECT count(*) AS billing_tables FROM sqlite_master WHERE type='table' AND name IN ('billing_orders','billing_access','billing_events');"
      - name: Verify local D1 required table is accessible
        run: npx wrangler d1 execute SAHAMBAN_DB --local --config server/wrangler.local.toml --command "SELECT count(*) AS tables_found FROM sqlite_master WHERE type='table' AND name='subscription_orders';"
      - name: Exercise local Worker HTTP endpoints and D1 authorization (no deployment)
        run: node tests/worker-local-runtime.cjs
      - name: Exercise synthetic-price pending order lifecycle in local Worker+D1 only
        run: LOCAL_TEST_ENABLE_BILLING_V2=1 node tests/worker-local-runtime.cjs
      - name: Exercise real username/password login, session, CSRF, logout and billing on local Worker+D1
        run: LOCAL_TEST_ENABLE_PASSWORD_AUTH=1 LOCAL_TEST_ENABLE_BILLING_V2=1 node tests/worker-local-runtime.cjs
      - name: Check generated bundle exists
        run: test -n "$(find /tmp/sahamban-worker-bundle -type f -name '*.js' -print -quit)"
