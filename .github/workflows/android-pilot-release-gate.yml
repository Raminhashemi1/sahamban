name: Sahmino release build gate (payments disabled)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-release-gate.yml'
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required}"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build both release variants with checkout forced off
        shell: bash
        env:
          SAHAMBAN_APPLICATION_ID: ir.sahmino.app
          SAHAMBAN_EXPECTED_PACKAGE_NAME: ir.sahmino.app
          SAHAMBAN_PWA_ORIGIN: https://raminhashemi1.github.io
          SAHAMBAN_BILLING_ENABLED: 'false'
        run: |
          set -euo pipefail
          gradle -p android-pilot --no-daemon :app:assembleBazaarRelease :app:assembleMyketRelease
          python3 - <<'PY'
          import glob, subprocess, sys
          apks = glob.glob('android-pilot/app/build/outputs/apk/*/release/*.apk')
          if len(apks) != 2:
              raise SystemExit(f'Expected exactly two release APKs, found {len(apks)}')
          for apk in sorted(apks):
              out = subprocess.check_output(['apkanalyzer','manifest','application-id',apk], text=True).strip()
              if out != 'ir.sahmino.app':
                  raise SystemExit(f'Unexpected package {out} in {apk}')
              print(f'PASS package={out} artifact={apk}')
          PY
      - name: Verify release checkout hard-off in generated BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          for flavor in bazaar myket; do
            grep -R 'SAHAMBAN_BILLING_ENABLED = false' "android-pilot/app/build/generated/source/buildConfig/release/$flavor" >/dev/null
          done
      - name: Label artifacts explicitly as unsigned non-store candidates
        run: |
          find android-pilot/app/build/outputs/apk -path '*/release/*.apk' -type f -print0 | xargs -0 sha256sum
      - uses: actions/upload-artifact@v4
        with:
          name: sahmino-release-build-unsigned-checkout-disabled-NOT-STORE-READY
          path: android-pilot/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 7
