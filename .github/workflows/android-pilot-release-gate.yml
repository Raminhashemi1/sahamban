name: Sahmino release build gate (payments disabled)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-release-gate.yml'
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required}"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build both release variants with checkout forced off
        shell: bash
        env:
          SAHAMBAN_APPLICATION_ID: ir.sahmino.app
          SAHAMBAN_EXPECTED_PACKAGE_NAME: ir.sahmino.app
          SAHAMBAN_PWA_ORIGIN: https://raminhashemi1.github.io
          SAHAMBAN_BILLING_ENABLED: 'false'
        run: |
          set -euo pipefail
          gradle -p android-pilot --no-daemon :app:assembleBazaarRelease :app:assembleMyketRelease
          python3 - <<'PY'
          import glob, subprocess, sys
          apks = glob.glob('android-pilot/app/build/outputs/apk/*/release/*.apk')
          if len(apks) != 2:
              raise SystemExit(f'Expected exactly two release APKs, found {len(apks)}')
          import os
          aapt = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0', 'aapt')
          for apk in sorted(apks):
              lines = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True).splitlines()
              package_line = next((line for line in lines if line.startswith('package:')), '')
              if "name='ir.sahmino.app'" not in package_line:
                  raise SystemExit(f'Unexpected package identity in {apk}: {package_line}')
              if "versionCode='1'" not in package_line or "versionName='1.0.0'" not in package_line:
                  raise SystemExit(f'Unexpected initial release version in {apk}: {package_line}')
              if any(line.startswith('application-debuggable') for line in lines):
                  raise SystemExit(f'Debuggable APK is not accepted as a release candidate: {apk}')
              print(f'PASS package=ir.sahmino.app versionCode=1 versionName=1.0.0 debuggable=false artifact={apk}')
          PY
      - name: Verify release checkout hard-off in generated BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          for flavor in bazaar myket; do
            dir="android-pilot/app/build/generated/source/buildConfig/$flavor/release"
            test -d "$dir"
            grep -R -E 'SAHAMBAN_BILLING_ENABLED = (false|Boolean.parseBoolean\("false"\));' "$dir" >/dev/null || {
              echo "::error::Release BuildConfig for $flavor does not prove billing is hard-disabled"
              find "$dir" -name BuildConfig.java -type f -maxdepth 8 -print
              exit 1
            }
            echo "PASS $flavor release checkout hard-disabled"
          done
      - name: Label artifacts explicitly as unsigned non-store candidates
        run: |
          set -euo pipefail
          find android-pilot/app/build/outputs/apk -path '*/release/*.apk' -type f -print0 | sort -z | xargs -0 sha256sum | tee android-pilot-release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sahmino-release-build-unsigned-checkout-disabled-NOT-STORE-READY
          path: |
            android-pilot/app/build/outputs/apk/*/release/*.apk
            android-pilot-release-sha256.txt
          if-no-files-found: error
          retention-days: 7
