name: Sahamban after-close live market check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sahamban-after-close-market-check
  cancel-in-progress: false

jobs:
  live-market-after-close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe TSETMC CDN read-only API
        run: node tests/live-market-connectivity.cjs
        continue-on-error: true
      - name: Probe official TSE web gateway fallback
        run: node tests/live-market-webgw-fallback.cjs
        continue-on-error: true
      - name: Validate after-close report semantics
        run: node --test tests/after-close-summary.test.cjs
      - name: Publish explicit verified or unverified summary
        if: always()
        run: node tests/after-close-summary.cjs
      - name: Preserve after-close live market evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-after-close-market-check
          path: |\n            test-artifacts/live-market-*.json\n            test-artifacts/after-close-summary.json
          if-no-files-found: warn
          retention-days: 30
