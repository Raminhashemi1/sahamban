name: Professional Risk v49 Safety
on:
  push:
    branches: [main, feat/v49-professional-risk-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check professional-risk-v49.js && node --check portfolio-asset-allocation-v62.js && node --check portfolio-fund-nav-v63.js && node --check portfolio-pilot-v61.js
      - run: node --test tests/professional-risk-v49.test.cjs tests/portfolio-asset-allocation-v62.test.cjs tests/portfolio-fund-nav-v63.test.cjs tests/home-portfolio-v61-entry.test.cjs tests/pilot-v61-coverage.test.cjs
      - run: node tests/smoke.cjs
