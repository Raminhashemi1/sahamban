name: Professional Risk v49 Safety
on:
  push:
    branches: [main, feat/v49-professional-risk-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check professional-risk-v49.js && node --check portfolio-asset-allocation-v62.js && node --check fund-nav-source-audit-v71.js && node --check fund-nav-quality-v70.js && node --check portfolio-fund-nav-v63.js && node --check portfolio-diagnostic-v74.js && node --check portfolio-status-dashboard-v73.js && node --check portfolio-top-three-stress-v69.js && node --check portfolio-concentration-v68.js && node --check portfolio-relative-turnover-v67.js && node --check portfolio-trading-trend-v66.js && node --check portfolio-liquidity-history-v65.js && node --check portfolio-pilot-v61.js
      - run: node --test tests/professional-risk-v49.test.cjs tests/portfolio-asset-allocation-v62.test.cjs tests/portfolio-fund-nav-v63.test.cjs tests/fund-nav-quality-v70.test.cjs tests/fund-nav-source-audit-v71.test.cjs tests/nav-clock-v72.test.cjs tests/portfolio-trading-activity-v64.test.cjs tests/portfolio-liquidity-history-v65.test.cjs tests/portfolio-trading-trend-v66.test.cjs tests/portfolio-relative-turnover-v67.test.cjs tests/portfolio-concentration-v68.test.cjs tests/portfolio-top-three-stress-v69.test.cjs tests/portfolio-status-dashboard-v73.test.cjs tests/portfolio-diagnostic-v74.test.cjs tests/portfolio-diagnostic-consistency-v75.test.cjs tests/portfolio-refresh-status-v76.test.cjs tests/public-network-diagnostic-v77.test.cjs tests/home-portfolio-v61-entry.test.cjs tests/pilot-v61-coverage.test.cjs
      - run: node tests/smoke.cjs
