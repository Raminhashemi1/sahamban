name: Professional Risk v49 Safety
on:
  push:
    branches: [main, feat/v49-professional-risk-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check professional-risk-v49.js
      - run: node --test tests/professional-risk-v49.test.cjs
      - run: node tests/smoke.cjs
