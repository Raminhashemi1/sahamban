name: v48 isolated holdings-race regression
on:
  push:
    branches: [test/v48-holdings-race-guard-20261029]
  pull_request:
    branches: [feat/portfolio-live-prices-v48]
jobs:
  browser-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check holdings-live.js
          node --check tests/browser.cjs
      - name: Run portfolio safety unit tests
        run: node --test tests/portfolio-live.test.cjs
      - name: Install test-only Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser tests including concurrent holdings mutation
        run: node tests/browser.cjs
