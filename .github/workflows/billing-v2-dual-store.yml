name: Sahmino dual-store Billing V2 validation

on:
  push:
    branches:
      - feature/sahmino-username-password-auth
      - integration/sahmino-billing-v2-dual-store
    paths:
      - 'server/billing/**'
      - 'server/worker-api.mjs'
      - 'server/password-auth.cjs'
      - 'server/migrations/**'
      - 'server/wrangler.bazaar.toml.example'
      - 'server/wrangler.myket.toml.example'
      - 'server/wrangler.local.toml'
      - 'android-pilot/**'
      - 'scripts/provision-sahmino-user.mjs'
      - 'tests/billing-v2-*'
      - 'tests/password-auth*'
      - 'tests/provision-sahmino-user.test.cjs'
      - 'tests/worker-api.test.cjs'
      - 'tests/android-pilot-wrapper.test.cjs'
      - '.github/workflows/android-pilot-debug.yml'
      - '.github/workflows/billing-v2-dual-store.yml'
  pull_request:
    paths:
      - 'server/billing/**'
      - 'server/worker-api.mjs'
      - 'server/password-auth.cjs'
      - 'server/migrations/**'
      - 'server/wrangler.bazaar.toml.example'
      - 'server/wrangler.myket.toml.example'
      - 'server/wrangler.local.toml'
      - 'scripts/provision-sahmino-user.mjs'
      - 'tests/password-auth*'
      - 'tests/billing-v2-*'
      - 'tests/worker-api.test.cjs'
      - 'tests/android-pilot-wrapper.test.cjs'
      - 'android-pilot/**'
      - '.github/workflows/billing-v2-dual-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Worker and authentication services
        run: |
          node --check server/worker-api.mjs
          node --check server/password-auth.cjs
          node --check scripts/provision-sahmino-user.mjs
          node --check server/billing/bazaar.mjs
          node --check server/billing/myket.mjs
          node --check server/billing/myket-verifier.mjs
          node --check server/billing/orders.cjs
          node --check server/billing/settlement.cjs
      - name: Bundle Cloudflare Worker without deploying
        run: |
          npm install --no-save wrangler@4.102.0
          npx wrangler deploy --dry-run --config server/wrangler.local.toml --outdir /tmp/sahmino-worker-bundle
          test -n "$(find /tmp/sahmino-worker-bundle -type f -name '*.js' -print -quit)"
      - name: Validate Android host security and flavor workflow wiring
        run: node --test tests/android-pilot-wrapper.test.cjs
      - name: Run password authentication and Worker session tests
        run: node --test tests/password-auth.test.cjs tests/provision-sahmino-user.test.cjs tests/worker-api.test.cjs
      - name: Validate username/password D1 migration
        run: python tests/password-auth-migration.test.py
      - name: Run Bazaar and shared Billing V2 tests
        run: node --test tests/billing-v2.test.cjs tests/billing-v2-catalog.test.cjs tests/billing-v2-bazaar.test.mjs tests/billing-v2-settlement.test.cjs tests/billing-v2-d1.integration.test.cjs
      - name: Run Myket verifier, order and shared settlement tests
        run: node --test tests/billing-v2-myket-verifier.test.mjs tests/billing-v2-myket-orders.test.cjs tests/billing-v2-myket-settlement.test.cjs tests/billing-v2-myket-flow.test.mjs
      - name: Validate fresh and existing D1 billing schema paths
        run: python tests/billing-v2-dual-store-schema.test.py
