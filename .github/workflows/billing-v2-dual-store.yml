name: Sahmino dual-store Billing V2 validation

on:
  push:
    branches:
      - integration/sahmino-billing-v2-dual-store
    paths:
      - 'server/billing/**'
      - 'server/worker-api.mjs'
      - 'tests/billing-v2-*'
      - '.github/workflows/billing-v2-dual-store.yml'
  pull_request:
    paths:
      - 'server/billing/**'
      - 'server/worker-api.mjs'
      - 'tests/billing-v2-*'
      - '.github/workflows/billing-v2-dual-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Billing V2 services
        run: |
          node --check server/worker-api.mjs
          node --check server/billing/bazaar.mjs
          node --check server/billing/myket.mjs
          node --check server/billing/myket-verifier.mjs
          node --check server/billing/orders.cjs
          node --check server/billing/settlement.cjs
      - name: Run Bazaar and shared Billing V2 tests
        run: node --test tests/billing-v2.test.cjs tests/billing-v2-catalog.test.cjs tests/billing-v2-bazaar.test.mjs tests/billing-v2-settlement.test.cjs tests/worker-api.test.cjs
      - name: Run Myket verifier, order and shared settlement tests
        run: node --test tests/billing-v2-myket-verifier.test.mjs tests/billing-v2-myket-orders.test.cjs tests/billing-v2-myket-settlement.test.cjs tests/billing-v2-myket-flow.test.mjs
      - name: Validate fresh and existing D1 schema paths
        run: python tests/billing-v2-dual-store-schema.test.py
