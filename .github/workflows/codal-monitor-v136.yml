name: Sahamban Codal read-only verification v136
on:
  workflow_dispatch:
  schedule:
    # One low-frequency probe per Tehran trading day; avoid aggressive polling.
    - cron: '30 6 * * 6,0-3'
  push:
    branches: [main]
    paths:
      - 'tests/codal-connectivity-v136.cjs'
      - 'tests/codal-response-v137.test.cjs'
      - 'tests/codal-search-quality.cjs'
      - 'tests/codal-search-quality.test.cjs'
      - 'tests/codal-browser-quality.test.cjs'
      - 'tests/codal-report-link.test.cjs'
      - 'fundamental-evidence.js'
      - 'codal-disclosure-v137.js'
      - 'codal-original-intake-v138.js'
      - 'codal-source-rows-v139.js'
      - 'codal-audit-recheck-v140.js'
      - 'tests/codal-audit-recheck-v140.test.cjs'
      - 'tests/codal-source-rows-v139.test.cjs'
      - 'module-hub-v87.js'
      - 'tests/codal-original-intake-v138.test.cjs'
      - 'tests/codal-disclosure-v137.test.cjs'
      - 'index.html'
      - 'sw.js'
      - 'tests/fundamental-evidence.test.cjs'
      - 'market-connectivity-test.html'
      - '.github/workflows/codal-monitor-v136.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate diagnostic
        run: node --check tests/codal-connectivity-v136.cjs
      - name: Test Codal JSON/XML parser against offline fixtures
        run: node --test tests/codal-response-v137.test.cjs
      - name: Validate filing identity and dates with synthetic fixtures
        run: node --test tests/codal-search-quality.test.cjs
      - name: Verify browser diagnostic follows strict metadata validation
        run: node --test tests/codal-browser-quality.test.cjs
      - name: Validate safe original Codal report links
        run: node --test tests/codal-report-link.test.cjs
      - name: Test strict fundamental evidence readiness gate
        run: node --test tests/fundamental-evidence.test.cjs
      - name: Test embedded read-only CODAL discovery and safety gates
        run: node --test tests/codal-disclosure-v137.test.cjs
      - name: Test local original-report fingerprint safety gate
        run: node --test tests/codal-original-intake-v138.test.cjs
      - name: Test local financial-row provenance without authorizing ratios
        run: node --test tests/codal-source-rows-v139.test.cjs
      - name: Verify local audit JSON against exact source bytes with tamper checks
        run: node --test tests/codal-audit-recheck-v140.test.cjs
      - name: Check one public Codal filing search (read-only)
        run: node tests/codal-connectivity-v136.cjs
      - name: Preserve outcome, including block or network failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-codal-v136
          path: test-artifacts/codal-v136.json
          if-no-files-found: warn
          retention-days: 30
