name: Sahmino signed initial release (checkout disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate production Worker endpoint required by native login
        shell: bash
        env:
          SAHAMBAN_WORKER_BASE_URL: ${{ vars.SAHAMBAN_WORKER_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SAHAMBAN_WORKER_BASE_URL:-}" ]]; then
            echo "::error::Configure the repository Actions variable SAHAMBAN_WORKER_BASE_URL with the production HTTPS Worker origin before creating a signed app. Without it, native login cannot start."
            exit 1
          fi
          python3 - <<'PY'
          import os, sys, urllib.parse
          value = os.environ["SAHAMBAN_WORKER_BASE_URL"]
          parsed = urllib.parse.urlparse(value)
          valid = (parsed.scheme == "https" and bool(parsed.hostname) and
                   parsed.username is None and parsed.password is None and
                   parsed.path in ("", "/") and not parsed.query and not parsed.fragment)
          if not valid:
              raise SystemExit("SAHAMBAN_WORKER_BASE_URL must be an HTTPS origin without credentials, path, query, or fragment.")
          print("PASS production Worker origin configured")
          PY
      - name: Validate owner-managed signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SAHMINO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAHMINO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAHMINO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAHMINO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required owner-managed signing secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sahmino-release.jks"
          test -s "$RUNNER_TEMP/sahmino-release.jks"
          chmod 600 "$RUNNER_TEMP/sahmino-release.jks"
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required}"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed Bazaar and Myket release APKs with checkout forced off
        shell: bash
        env:
          SAHAMBAN_APPLICATION_ID: ir.sahmino.app
          SAHAMBAN_EXPECTED_PACKAGE_NAME: ir.sahmino.app
          SAHAMBAN_PWA_ORIGIN: https://raminhashemi1.github.io
          SAHAMBAN_WORKER_BASE_URL: ${{ vars.SAHAMBAN_WORKER_BASE_URL }}
          SAHAMBAN_BILLING_ENABLED: 'false'
          SAHMINO_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/sahmino-release.jks
          SAHMINO_RELEASE_STORE_PASSWORD: ${{ secrets.SAHMINO_RELEASE_STORE_PASSWORD }}
          SAHMINO_RELEASE_KEY_ALIAS: ${{ secrets.SAHMINO_RELEASE_KEY_ALIAS }}
          SAHMINO_RELEASE_KEY_PASSWORD: ${{ secrets.SAHMINO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p android-pilot --no-daemon :app:assembleBazaarRelease :app:assembleMyketRelease
      - name: Verify signatures, package identity, and checkout-off release configuration
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for flavor in bazaar myket; do
            APK="android-pilot/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
            test "$PACKAGE" = "ir.sahmino.app"
            DIR="android-pilot/app/build/generated/source/buildConfig/$flavor/release"
            grep -R -E 'SAHAMBAN_BILLING_ENABLED = (false|Boolean.parseBoolean\("false"\));' "$DIR" >/dev/null
            echo "PASS signed=$flavor package=$PACKAGE checkout=disabled"
          done
          sha256sum android-pilot/app/build/outputs/apk/*/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahmino-signed-initial-release-checkout-disabled
          path: android-pilot/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sahmino-release.jks"
