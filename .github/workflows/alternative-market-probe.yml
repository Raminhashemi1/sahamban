name: Alternative market provider discovery
on:
  workflow_dispatch:
  push:
    branches: [feat/portfolio-live-prices-v48]
    paths:
      - 'tests/alternative-source-probe.cjs'
      - '.github/workflows/alternative-market-probe.yml'
jobs:
  alternative-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/alternative-source-probe.cjs
