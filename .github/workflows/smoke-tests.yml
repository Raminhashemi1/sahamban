name: Sahamban smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node --test tests/compact-dashboard-v92.test.cjs tests/beginner-experience-v93.test.cjs tests/module-finder-v94.test.cjs tests/beginner-reading-v95.test.cjs tests/visual-consistency-v96.test.cjs tests/mobile-table-v97.test.cjs tests/holdings-view-v98.test.cjs tests/holdings-cards-v99.test.cjs tests/ux-milestone-v100.test.cjs tests/mobile-performance-v101.test.cjs tests/browser-perf-v102.test.cjs tests/update-notice-v103.test.cjs tests/cache-refresh-v103.test.cjs tests/card-search-v104.test.cjs tests/keyboard-access-v105.test.cjs
      - run: node --test tests/module-hub-v87.test.cjs
      - run: node tests/sw-offline.cjs
      - run: node --test tests/reliability-security-v149.test.cjs
      - run: node --test tests/portfolio-insights-scroll-v115.test.cjs
      - run: node --test tests/subscription-entitlements.test.cjs tests/subscription-orders.test.cjs
      - run: node --test tests/prepaid-plans.test.cjs
      - run: node --test tests/prepaid-access-gate.test.cjs
      - run: node --test tests/prepaid-orders-api.test.cjs
      - run: node --test tests/prepaid-account-overview.test.cjs
      - run: node --test tests/prepaid-settlement.test.cjs
      - run: node --test tests/pro-access-gate.test.cjs
      - run: node --test tests/worker-api.test.cjs
      - run: node --test tests/pilot-orders-api.test.cjs
      - run: node --test tests/mint-pilot-token.test.cjs
      - run: node --test tests/manual-bank-reconciliation.test.cjs
      - run: node --test tests/manual-subscription-settlement.test.cjs
      - run: node --test tests/manual-settlement-db.test.cjs
      - run: node --test tests/prospective-signal-ledger.test.cjs
      - run: node --test tests/fixed-rule-evaluator.test.cjs
      - run: node --test tests/android-pilot-wrapper.test.cjs tests/android-backup-self-test.test.cjs tests/android-isolated-acceptance.test.cjs
      - run: node --test tests/generate-pilot-deploy-config.test.cjs
      - run: node --test tests/d1-schema.test.cjs
      - run: python tests/d1-schema.integration.test.py
      - run: python tests/d1-prepaid-migration.test.py
      - run: python tests/d1-prepaid-settlement-sqlite.integration.test.py
      - run: node --test tests/decision-support-v129.test.cjs tests/external-screener-v130.test.cjs tests/market-sample-v131.test.cjs tests/signal-audit-v132.test.cjs tests/candidate-ranking-v133.test.cjs tests/temporal-holdout-v134.test.cjs
      - run: node --test tests/fundamental-evidence.test.cjs
      - run: node --test tests/capital-adjustments.test.cjs
      - run: node --test tests/tse-client-three-mode-adapter-v161.test.cjs
      - run: node --test tests/audit-gheshdab-price-csv.test.cjs
      - run: node --check tools/audit-gheshdab-price-csv.cjs
      - run: node --test tests/fundamental-decision-gate-v150.test.cjs
      - run: node --test tests/fundamental-browser-runtime-v150.test.cjs
      - run: node --check fundamental-evidence.js
      - run: node --check fundamental-decision-gate-v150.js
      - run: node --check capital-adjustments.js
      - run: node --check tse-client-three-mode-adapter-v161.js
      - run: node --check decision-support-ui-v129.js
      - run: node --test tests/codal-search-quality.test.cjs tests/codal-source-rows-v139.test.cjs tests/codal-original-intake-v138.test.cjs tests/codal-browser-quality.test.cjs
      - run: node --test tests/codal-audit-recheck-v140.test.cjs
      - run: node --test tests/portfolio-price-empty-v116.test.cjs
      - run: node --test tests/market-connectivity-page.test.cjs
      - run: node --test tests/market-symbol-lines.test.cjs
      - run: node --test tests/market-history-v113.test.cjs
      - run: node tests/market-validation.cjs
      - run: node tests/market-freshness-v111.test.cjs
      - run: node --test tests/market-date-tehran-v127.test.cjs
      - run: node tests/live-market-connectivity.cjs
      - name: Preserve explicit live-market status (including network skip)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-live-market-v111-outcome
          path: test-artifacts/live-market-v111.json
          if-no-files-found: warn
          retention-days: 14
      - run: node --test tests/broker-import-security-v145.test.cjs
      - run: node --test tests/broker-import-race-v146.test.cjs
      - run: node --test tests/local-backup-v148.test.cjs tests/native-backup-export-v1.test.cjs
      - run: node --check portfolio-pilot-v61.js
      - run: node --test tests/pilot-v61-coverage.test.cjs tests/home-portfolio-v61-entry.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - run: node tests/field-alert-talkback-v126.cjs
      - run: node tests/learning-v128.cjs
      - run: node tests/external-screener-browser-v130.cjs
      - run: node tests/market-sample-browser-v131.cjs
      - run: node tests/holdings-ui-matrix-v117.cjs
      - run: node tests/portfolio-axe-v118.cjs
      - run: node tests/pwa-install-v119.cjs
      - name: Preserve PWA install readiness proof (Chromium)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-pwa-install-v119-chromium
          path: test-artifacts/pwa-install-v119-chromium.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve WCAG audit findings from Chromium
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-a11y-chromium-v118
          path: test-artifacts/a11y-v118-chromium.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save synthetic Chromium holdings UI matrix result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-chromium-holdings-ui-v117
          path: test-artifacts/holdings-ui-matrix-v117-chromium.json
          if-no-files-found: warn
          retention-days: 14
      - run: node tests/android-lowend-v110.cjs
      - name: Save Android low-end proxy timing samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-android-lowend-v110
          path: test-artifacts/android-lowend-v110.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-chromium-failure
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
