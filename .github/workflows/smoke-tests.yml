name: Sahamban smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node --test tests/compact-dashboard-v92.test.cjs tests/beginner-experience-v93.test.cjs tests/module-finder-v94.test.cjs tests/beginner-reading-v95.test.cjs tests/visual-consistency-v96.test.cjs tests/mobile-table-v97.test.cjs tests/holdings-view-v98.test.cjs tests/holdings-cards-v99.test.cjs tests/ux-milestone-v100.test.cjs tests/mobile-performance-v101.test.cjs tests/browser-perf-v102.test.cjs
      - run: node tests/sw-offline.cjs
      - run: node tests/market-validation.cjs
      - run: node tests/live-market-connectivity.cjs
      - run: node --check portfolio-pilot-v61.js
      - run: node --test tests/pilot-v61-coverage.test.cjs tests/home-portfolio-v61-entry.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - name: Save Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sahamban-chromium-failure
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
