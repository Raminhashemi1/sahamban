name: CODAL remote corroboration security tests

on:
  pull_request:
    paths:
      - 'codal-remote-byte-corroboration-v152.cjs'
      - 'codal-search-association-v153.cjs'
      - 'tests/codal-search-association-v153.test.cjs'
      - 'codal-original-intake-v138.js'
      - 'tests/codal-audit-recheck-v140.test.cjs'
      - '.github/workflows/codal-remote-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codal-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CODAL source and remote corroboration tests
        run: node --test tests/codal-audit-recheck-v140.test.cjs tests/codal-search-association-v153.test.cjs
