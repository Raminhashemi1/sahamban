name: Day 3 cross-symbol reconciliation safeguards
on:
  pull_request:
    paths:
      - 'scripts/day3_cross_symbol_event_audit.py'
      - 'tests/test_day3_cross_symbol_event_audit.py'
      - '.github/workflows/day3-cross-symbol-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact matches, mismatches and rejection paths
        run: python3 -m unittest discover -s tests -p 'test_day3_cross_symbol_event_audit.py' -v
