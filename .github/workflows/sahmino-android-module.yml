name: Sahmino Android billing module compile

on:
  push:
    branches:
      - feature/sahmino-subscriptions-independent
    paths:
      - 'subscription-module/android/**'
      - '.github/workflows/sahmino-android-module.yml'
  pull_request:
    paths:
      - 'subscription-module/android/**'
      - '.github/workflows/sahmino-android-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-flavors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Bazaar and Myket release flavors
        run: gradle -p subscription-module/android assembleBazaarRelease assembleMyketRelease
