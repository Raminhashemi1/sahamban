name: Sahmino Android billing module compile

on:
  push:
    branches:
      - feature/sahmino-subscriptions-independent
    paths:
      - 'subscription-module/android/**'
      - '.github/workflows/sahmino-android-module.yml'
  pull_request:
    paths:
      - 'subscription-module/android/**'
      - '.github/workflows/sahmino-android-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-flavors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Bazaar and Myket release flavors
        run: gradle -p subscription-module/android assembleBazaarRelease assembleMyketRelease
      - name: Upload store-specific Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: sahmino-billing-android-aar
          path: subscription-module/android/build/outputs/aar/*.aar
          if-no-files-found: error
