name: Sahmino CafeBazaar integration validation
# Build internal debug APKs for device validation only. Never publish these artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - 'tests/android-pilot-wrapper.test.cjs'
      - 'tests/android-marketplace-flow.test.cjs'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - name: Verify five-plan billing catalog with Java
        shell: bash
        run: |
          mkdir -p /tmp/sahmino-billing-check
          javac -d /tmp/sahmino-billing-check android-pilot/tests/fakes/ir/sahamban/pilot/BuildConfig.java android-pilot/app/src/main/java/ir/sahamban/pilot/SahminoBillingCatalog.java android-pilot/tests/SahminoBillingCatalogTest.java
          java -cp /tmp/sahmino-billing-check ir.sahamban.pilot.SahminoBillingCatalogTest
      - name: Enforce native subscription purchase policy
        shell: bash
        run: |
          set -euo pipefail
          MANAGER=android-pilot/app/src/bazaar/java/ir/sahamban/pilot/BazaarBillingManager.java
          grep -q 'poolakey' android-pilot/app/build.gradle
          grep -q 'subscribeProduct' "$MANAGER"
          grep -q 'getSubscriptionSkuDetails' "$MANAGER"
          grep -q 'getSubscribedProducts' "$MANAGER"
          ! grep -q 'purchaseProduct' "$MANAGER"
          ! grep -q 'consumeProduct' "$MANAGER"
          echo "CafeBazaar subscription purchase policy: PASS"
      - name: Verify IRR-only store price matching
        shell: bash
        run: |
          mkdir -p /tmp/sahmino-price-check
          javac -d /tmp/sahmino-price-check android-pilot/app/src/main/java/ir/sahamban/pilot/SahminoStorePriceMatcher.java android-pilot/tests/SahminoStorePriceMatcherTest.java
          java -cp /tmp/sahmino-price-check ir.sahamban.pilot.SahminoStorePriceMatcherTest
      - name: Verify store-specific flavor configuration
        run: node --test tests/android-pilot-wrapper.test.cjs
      - name: Verify native marketplace order and receipt flow contracts
        run: node --test tests/android-marketplace-flow.test.cjs
      - name: Validate embedded dashboard subscription JavaScript
        shell: bash
        run: node --check android-pilot/app/src/main/assets/sahmino-webview-ui.js
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile CafeBazaar variant
        run: gradle -p android-pilot --no-daemon :app:compileBazaarDebugJavaWithJavac
      - name: Assemble CafeBazaar internal debug APK (not for store upload)
        run: gradle -p android-pilot --no-daemon :app:assembleBazaarDebug
      - name: Verify CafeBazaar APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android-pilot/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
          sha256sum android-pilot/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
      - name: Upload CafeBazaar internal debug APK for physical-device testing
        uses: actions/upload-artifact@v4
        with:
          name: sahmino-cafebazaar-debug-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            android-pilot/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
