name: Sahamban Android pilot debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate required Worker endpoint configuration
        shell: bash
        env:
          SAHAMBAN_WORKER_BASE_URL: ${{ vars.SAHAMBAN_WORKER_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SAHAMBAN_WORKER_BASE_URL:-}" ]]; then
            echo "::error::Set the repository Actions variable SAHAMBAN_WORKER_BASE_URL to the deployed HTTPS Worker origin before building installable pilot APKs."
            exit 1
          fi
          python3 -c 'import os,sys,urllib.parse; u=urllib.parse.urlparse(os.environ["SAHAMBAN_WORKER_BASE_URL"]); sys.exit(0 if u.scheme=="https" and u.netloc and not u.path.rstrip("/") and not u.query and not u.fragment else 1)' || {
            echo "::error::SAHAMBAN_WORKER_BASE_URL must be an HTTPS origin without path, query, or fragment."
            exit 1
          }
      - name: Build TEST-ONLY Bazaar and Myket debug APKs without owner signing credentials
        shell: bash
        env:
          SAHAMBAN_WORKER_BASE_URL: ${{ vars.SAHAMBAN_WORKER_BASE_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle -p android-pilot --no-daemon :app:assembleBazaarDebug :app:assembleMyketDebug; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Gradle dependency resolution/build failed on attempt $attempt; retrying after a short delay."
              sleep 20
            fi
          done
          exit 1
      - name: Print reproducibility digest (never a private certificate)
        run: sha256sum android-pilot/app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahamban-android-pilot-dual-store-debug-UNSIGNED-FOR-STORE
          path: android-pilot/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
