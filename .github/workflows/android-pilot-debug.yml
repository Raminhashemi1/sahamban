name: Sahamban Android pilot debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java \
            android-pilot/app/src/main/java/ir/sahamban/pilot/BackupExportPolicy.java \
            android-pilot/app/src/main/java/ir/sahamban/pilot/BackupFileVerifier.java \
            android-pilot/tests/TrustedNavigationTest.java \
            android-pilot/tests/BackupExportPolicyTest.java \
            android-pilot/tests/BackupFileVerifierTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.BackupExportPolicyTest
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.BackupFileVerifierTest
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build TEST-ONLY debug APK without owner signing credentials
        run: gradle -p android-pilot --no-daemon :app:assembleDebug
      - name: Audit test APK identity, bundled offline screen and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=android-pilot/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ir.sahamban.pilot' versionCode='4' versionName='0.3.1-pilot'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'BackupSelfTestActivity'
          unzip -Z1 "$APK" | grep -Fx 'assets/backup-self-test.html'
          "$AAPT" dump permissions "$APK" > /tmp/sahamban-apk-permissions.txt
          grep -F 'android.permission.INTERNET' /tmp/sahamban-apk-permissions.txt
          if grep -Eq 'android.permission.(READ_|WRITE_|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION)' /tmp/sahamban-apk-permissions.txt; then
            echo 'Unexpected high-risk Android permission in debug APK' >&2
            exit 1
          fi
      - name: Print reproducibility digest (never a private certificate)
        run: sha256sum android-pilot/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahamban-android-pilot-debug-UNSIGNED-FOR-STORE
          path: android-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
