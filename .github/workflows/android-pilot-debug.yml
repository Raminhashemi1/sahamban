name: Sahmino CafeBazaar and Myket debug variants
# Build separate store-specific debug APKs; never publish debug artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - name: Verify store-specific flavor configuration\n        run: node --test tests/android-pilot-wrapper.test.cjs\n      - name: Validate embedded dashboard subscription JavaScript
        shell: bash
        run: node --check android-pilot/app/src/main/assets/sahmino-webview-ui.js
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build TEST-ONLY debug APK without owner signing credentials
        run: gradle -p android-pilot --no-daemon :app:assembleBazaarDebug :app:assembleMyketDebug
      - name: Print reproducibility digest (never a private certificate)
        run: sha256sum android-pilot/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk android-pilot/app/build/outputs/apk/myket/debug/app-myket-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahmino-market-debug-apks-NOT-FOR-STORE
          path: |
            android-pilot/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
            android-pilot/app/build/outputs/apk/myket/debug/app-myket-debug.apk
          if-no-files-found: error
          retention-days: 7
