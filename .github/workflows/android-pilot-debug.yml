name: Sahamban Android pilot debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build TEST-ONLY debug APK without owner signing credentials
        run: gradle -p android-pilot --no-daemon :app:assembleDebug
      - name: Print reproducibility digest (never a private certificate)
        run: sha256sum android-pilot/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahamban-android-pilot-debug-UNSIGNED-FOR-STORE
          path: android-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
