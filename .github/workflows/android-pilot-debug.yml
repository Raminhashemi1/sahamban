name: Sahamban Android pilot debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-pilot/**'
      - 'local-backup-v148.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/local-backup-v148.test.cjs'
      - 'tests/android-pilot-wrapper.test.cjs'
      - '.github/workflows/android-pilot-debug.yml'
  push:
    paths:
      - 'android-pilot/**'
      - 'local-backup-v148.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/local-backup-v148.test.cjs'
      - 'tests/android-pilot-wrapper.test.cjs'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Android package identity and host-security regression tests
        run: node --test tests/android-pilot-wrapper.test.cjs
      - name: Run local backup validation and Android export bridge tests
        run: node --test tests/local-backup-v148.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build TEST-ONLY debug APK without owner signing credentials
        run: gradle -p android-pilot --no-daemon :app:assembleDebug
      - name: Print reproducibility digest (never a private certificate)
        run: sha256sum android-pilot/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahamban-android-pilot-debug-UNSIGNED-FOR-STORE
          path: android-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
