name: Sahmino Bazaar and Myket integration validation
# Compile-check store variants only. Do not assemble or upload APKs before release readiness.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pilot/**'
      - 'tests/android-pilot-wrapper.test.cjs'
      - '.github/workflows/android-pilot-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify URL origin policy with a real Java runtime
        shell: bash
        run: |
          mkdir -p /tmp/sahamban-java-check
          javac -d /tmp/sahamban-java-check             android-pilot/app/src/main/java/ir/sahamban/pilot/TrustedNavigation.java             android-pilot/tests/TrustedNavigationTest.java
          java -cp /tmp/sahamban-java-check ir.sahamban.pilot.TrustedNavigationTest
      - name: Verify store-specific flavor configuration
        run: node --test tests/android-pilot-wrapper.test.cjs
      - name: Validate embedded dashboard subscription JavaScript
        shell: bash
        run: node --check android-pilot/app/src/main/assets/sahmino-webview-ui.js
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted runner must provide Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile-check both store variants (no APKs or artifacts)
        run: gradle -p android-pilot --no-daemon :app:compileBazaarDebugJavaWithJavac :app:compileMyketDebugJavaWithJavac
