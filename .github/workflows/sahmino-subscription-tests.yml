name: Sahmino subscription domain tests

on:
  push:
    branches:
      - feature/sahmino-subscriptions-independent
    paths:
      - 'subscription-module/**'
      - '.github/workflows/sahmino-subscription-tests.yml'
  pull_request:
    paths:
      - 'subscription-module/**'
      - '.github/workflows/sahmino-subscription-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run subscription domain tests
        run: npm --prefix subscription-module test
      - name: Run SQLite settlement contract tests
        run: python -m unittest discover -s subscription-module/tests -p 'sqlite_settlement_contract_test.py' -v
