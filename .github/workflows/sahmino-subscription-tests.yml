name: Sahmino subscription module tests

on:
  push:
    branches:
      - feat/sahmino-*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check prepaid module syntax
        run: |
          node --check server/prepaid-plans.cjs
          node --check server/prepaid-orders-api.cjs
          node --check server/prepaid-settlement.cjs
          node --check server/prepaid-account-overview.cjs
      - name: Run subscription unit and Worker tests
        run: >
          node --test
          tests/prepaid-plans.test.cjs
          tests/prepaid-orders-api.test.cjs
          tests/prepaid-settlement.test.cjs
          tests/prepaid-account-overview.test.cjs
          tests/worker-api.test.cjs
          tests/android-pilot-wrapper.test.cjs
      - name: Run repository smoke checks\n        run: node tests/smoke.cjs\n      - name: Run D1 migration constraints
        run: python tests/d1-prepaid-migration.test.py
      - name: Run D1 settlement SQL integration tests
        run: python tests/d1-prepaid-settlement-sqlite.integration.test.py
