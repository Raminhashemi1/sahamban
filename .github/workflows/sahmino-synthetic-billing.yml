name: Sahmino synthetic billing (isolated)
on:
  push:
    branches:
      - feat/sahmino-synthetic-entitlement-core-20261115
    paths:
      - 'billing/**'
      - 'tests/sahmino-*.test.cjs'
      - '.github/workflows/sahmino-synthetic-billing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    name: Node synthetic test suite (no payment access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact synthetic-only billing tests
        shell: bash
        run: |
          node --test \
            tests/sahmino-subscription-simulation-v1.test.cjs \
            tests/sahmino-synthetic-ledger-v1.test.cjs \
            tests/sahmino-staging-schema-contract.test.cjs \
            tests/sahmino-channel-policy-v1.test.cjs

  postgres-staging-smoke:
    name: Disposable PostgreSQL schema and rollback smoke (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sahmino_synthetic_ci
          POSTGRES_USER: sahmino_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sahmino_ci -d sahmino_synthetic_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert PostgreSQL constraints and rollback on disposable database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sahmino_synthetic_ci
          PGUSER: sahmino_ci
          PGPASSWORD: ephemeral_ci_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f billing/staging/002_postgres_smoke_synthetic.psql
