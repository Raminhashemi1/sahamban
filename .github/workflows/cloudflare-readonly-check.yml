name: Sahamban Cloudflare read-only connection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: cloudflare-pilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SAHAMBAN_D1_DATABASE_ID: ${{ vars.SAHAMBAN_D1_DATABASE_ID }}
    steps:
      - name: Verify stored credentials and resource access without modifying Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const token=process.env.CLOUDFLARE_API_TOKEN;
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            const db=process.env.SAHAMBAN_D1_DATABASE_ID;
            if(!token||!account||!db)throw Error('Missing GitHub environment secret or variable');
            if(!/^[a-f0-9]{32}$/.test(account)||!/^[a-f0-9-]{36}$/.test(db))
              throw Error('Invalid Cloudflare resource ID format');
            const base='https://api.cloudflare.com/client/v4';
            const headers={Authorization:'Bearer '+token,Accept:'application/json'};
            async function check(path,label){
              const response=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});
              let json;
              try{json=await response.json();}catch{throw Error(label+': invalid Cloudflare response (HTTP '+response.status+')');}
              if(!response.ok||json?.success!==true)
                throw Error(label+': API rejected request (HTTP '+response.status+', error codes '+(Array.isArray(json?.errors)?json.errors.map(e=>String(e.code).slice(0,8)).join(','):'unknown')+')');
              console.log('PASS '+label+' (read-only)');
              return json;
            }
            // User-scoped token verification. Do not print token value or provider response.
            const verify=await check('/user/tokens/verify','API token verification');
            if(verify?.result?.status!=='active')throw Error('API token is not active');
            await check('/accounts/'+account+'/d1/database/'+db,'D1 database access');
            // Script download endpoint returns JavaScript source, NOT a JSON envelope.
            // Validate the HTTP status without outputting or parsing deployed code.
            const script=await fetch(base+'/accounts/'+account+'/workers/scripts/sahamban-pro-pilot',{
              headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)
            });
            if(!script.ok)throw Error('Worker access: HTTP '+script.status);
            await script.body?.cancel();
            console.log('PASS Worker access (read-only, HTTP '+script.status+')');
            console.log('PASS: existing Cloudflare connection is readable; no deploy, migration or payment');
          })().catch(err=>{console.error('FAIL: '+String(err.message).slice(0,300));process.exitCode=1;});
          NODE
